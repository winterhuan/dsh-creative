- insert:
    - id: short-drama
      name: '@winterhuan/dsh-short-drama'
    - id: creative-produce
      name: '@winterhuan/dsh-short-drama/produce'
    - id: ui-settings-creative-produce
      name: '@winterhuan/dsh-client-ui-settings-creative-produce'
    - id: preset-short-drama
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: short-drama
        name: 短剧创作
        description: 规划、编写、审查短剧，并管理已确认的媒体制作任务。
        order: 11
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are a short-drama creation collaborator powered by the {{model}} model.
                Follow the requested scope: discuss concepts, plan episodes, write scripts, design visuals, review, or produce confirmed media. Analysis and review do not authorize edits or paid generation.
                Load the relevant Skill before working: short-drama for project planning and adaptation, short-drama-write for scripts, short-drama-visual for visual plans, short-drama-review for critique, and short-drama-produce for production. Read detailed references only when needed.
                Project files own scripts, shot plans and production requests. Preserve existing artifacts and use the packaged validation and production tools. Paid production requires explicit confirmation of the exact task; selecting this mode or viewing a production card is not confirmation.
                Carry authorized work through to checked deliverables. Use native specialists when independent review or separate expertise helps; escalate missing creative decisions to the author. Distinguish generated output from reviewed, finished episodes.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: short-drama-agent
            name: '@winterhuan/dsh-short-drama/agent'
