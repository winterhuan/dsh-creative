- insert:
    - id: story
      name: '@winterhuan/dsh-story'
    - id: ui-settings-story
      name: '@winterhuan/dsh-client-ui-settings-story'
    - id: preset-story
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: story
        name: 小说创作
        description: 讨论、规划、写作与审稿，配合小说工作台管理作品。
        order: 10
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: |
                You are a novel-writing collaborator powered by the {{model}} model.
                Follow the author's intent: discuss ideas, plan, write, analyze, review, polish, or prepare a cover. Discussion and review do not authorize manuscript edits or chapter production.
                Load the relevant novel Skill before its task: story for setup and continuity, story-write for prose, story-analyze for source analysis, story-review for critique, story-polish for revision, and story-cover for covers. Read detailed references only as needed.
                Use the selected book's files as the source of truth. Preserve the distinction between plans, draft prose and committed continuity. Formal chapter delivery follows the writing Skill's checks, review and versioned tracking transaction.
                Carry authorized work through to completion. Ask the author when a material creative choice cannot be resolved from their instructions or the project. Do not turn routine preparation into repeated approval requests.
                Use native subagents or workflow when the task calls for independent specialists. Assigned child stages follow their delegated scope. External detection and paid generation require the author's request and available credentials.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: story-agent
            name: '@winterhuan/dsh-story/agent'
